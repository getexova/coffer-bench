# Coffer stack: the API server and its PostgreSQL database.
#
# Works with `docker compose` and with `podman compose` / `podman-compose` 1.6.0.
# No `version:` key: it is obsolete in the Compose specification and podman-compose
# warns about it.
#
# Healthchecks live here, not in the Dockerfile: podman's default OCI image format
# silently drops a HEALTHCHECK instruction, so an image-level check would be a no-op
# on this host. Compose-level checks work under both runtimes.
#
# The database is never published to the host. Only the server's port is, on loopback.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume: `./scripts/down.sh` keeps it, so data survives down/up.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 tests the TCP listener, so the temporary server that initdb
      # runs on the unix socket cannot make the service look healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Every key in .env reaches the container. The server also retries its database
    # connection at boot, so the stack still comes up on a runtime that ignores
    # depends_on/condition.
    env_file:
      - .env
    environment:
      # Overrides for the container network. These win over env_file, which is what
      # keeps COFFER_PORT in .env a *host* port: the process always listens on 8420
      # inside the container and the mapping below moves it to ${COFFER_PORT}.
      COFFER_BIND_ADDR: "0.0.0.0"
      COFFER_PORT: "8420"
      COFFER_DB_HOST: db
      COFFER_DB_PORT: "5432"
      COFFER_DB_SSLMODE: disable
      COFFER_APP_DB_PASSWORD: ${COFFER_APP_DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      COFFER_MASTER_KEY: ${COFFER_MASTER_KEY}
      COFFER_BOOTSTRAP_ADMIN_EMAIL: ${COFFER_BOOTSTRAP_ADMIN_EMAIL}
      COFFER_BOOTSTRAP_ADMIN_PASSWORD: ${COFFER_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      # Loopback only. The database is not published at all.
      - "127.0.0.1:${COFFER_PORT:-8420}:8420"
    healthcheck:
      # busybox wget is all alpine carries; there is no curl in the runtime image.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8420/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  db_data:
